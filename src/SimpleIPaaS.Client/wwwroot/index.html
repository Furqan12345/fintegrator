<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fusetor.com — Integration Builder</title>
    <base href="/" />
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('simpleipaas-theme'); } catch (e) { }
            var theme = stored === 'dark' || stored === 'light'
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            window.simpleIPaaSTheme = {
                get: function () {
                    return document.documentElement.getAttribute('data-theme') || 'light';
                },
                set: function (value) {
                    var next = value === 'dark' ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', next);
                    try { localStorage.setItem('simpleipaas-theme', next); } catch (e) { }
                    return next;
                }
            };

            window.simpleIPaaSLayout = {
                getSidebar: function () {
                    try { return localStorage.getItem('simpleipaas-sidebar') || 'expanded'; } catch (e) { return 'expanded'; }
                },
                setSidebar: function (value) {
                    try { localStorage.setItem('simpleipaas-sidebar', value); } catch (e) { }
                    return value;
                }
            };

            window.simpleIPaaSChat = {
                scroll: function (id) {
                    var el = document.getElementById(id);
                    if (el) { el.scrollTop = el.scrollHeight; }
                },
                getPanel: function (name) {
                    try { return localStorage.getItem('simpleipaas-panel-' + name) || ''; } catch (e) { return ''; }
                },
                setPanel: function (name, value) {
                    try { localStorage.setItem('simpleipaas-panel-' + name, value); } catch (e) { }
                    return value;
                },
                bindComposer: function (id, dotnetHelper) {
                    var el = document.getElementById(id);
                    if (!el || el.dataset.chatBound === '1') return;
                    el.dataset.chatBound = '1';
                    el.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            dotnetHelper.invokeMethodAsync('SubmitPrompt').catch(function () { });
                        }
                    });
                }
            };

            window.simpleIPaaSTableColumns = {
                init: function (tableId, storageKey) {
                    if (!window.__simpleIPaaSTableColumnsModule) {
                        var moduleUrl = new URL('js/table-columns.js', document.baseURI).href;
                        window.__simpleIPaaSTableColumnsModule = import(moduleUrl);
                    }
                    return window.__simpleIPaaSTableColumnsModule
                        .then(function (module) { return module.init(tableId, storageKey); })
                        .catch(function (error) { console.error('table columns init failed', error); });
                },
                dispose: function (tableId) {
                    if (!window.__simpleIPaaSTableColumnsModule) {
                        return Promise.resolve();
                    }
                    return window.__simpleIPaaSTableColumnsModule
                        .then(function (module) { return module.dispose(tableId); })
                        .catch(function (error) { console.error('table columns dispose failed', error); });
                }
            };

            window.simpleIPaaSFullscreen = {
                isEnabled: function () {
                    return document.fullscreenEnabled !== undefined;
                },
                isActive: function () {
                    return document.fullscreenElement !== undefined && document.fullscreenElement !== null;
                },
                enter: function (selector) {
                    var el = selector ? document.querySelector(selector) : (document.fullscreenElement || document.documentElement);
                    if (!el) { return Promise.reject('element not found'); }
                    return el.requestFullscreen();
                },
                exit: function () {
                    if (document.exitFullscreen) { return document.exitFullscreen(); }
                    return Promise.resolve();
                },
                onFullScreenChange: function (dotNetHelper) {
                    document.addEventListener('fullscreenchange', function () {
                        dotNetHelper.invokeMethodAsync('NotifyFullscreenChange').catch(function () { });
                    });
                }
            };

            window.simpleIPaaSCopyText = function (text) {
                var value = text == null ? '' : String(text);
                window.__lastCopiedText = value;
                var fallback = function () {
                    var area = document.createElement('textarea');
                    area.value = value;
                    area.style.position = 'fixed';
                    area.style.opacity = '0';
                    document.body.appendChild(area);
                    area.focus();
                    area.select();
                    var copied = document.execCommand('copy');
                    document.body.removeChild(area);
                    return copied ? Promise.resolve() : Promise.reject(new Error('copy failed'));
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(value).catch(fallback);
                }
                return fallback();
            };

            window.simpleIPaaSVisibility = (function () {
                var handler = null;
                return {
                    start: function (helper) {
                        if (handler) { document.removeEventListener('visibilitychange', handler); }
                        handler = function () { helper.invokeMethodAsync('SetVisible', !document.hidden).catch(function () { }); };
                        document.addEventListener('visibilitychange', handler);
                        handler();
                    },
                    stop: function () {
                        if (handler) { document.removeEventListener('visibilitychange', handler); handler = null; }
                    }
                };
            })();

            window.simpleIPaaSDesigner = {
                markHttpErrorLinks: function (errorIds) {
                    var designer = window.simpleIPaaSDesigner;
                    designer._httpErrorIds = new Set(errorIds || []);
                    var apply = function () {
                        var errors = designer._httpErrorIds;
                        document.querySelectorAll('.diagram-link').forEach(function (group) {
                            if (errors.has(group.getAttribute('data-link-id')))
                                group.setAttribute('data-http-error', 'true');
                            else
                                group.removeAttribute('data-http-error');
                        });
                    };
                    apply();
                    requestAnimationFrame(apply);
                    setTimeout(apply, 100);
                    setTimeout(apply, 500);
                    // Watch only the diagram canvas (not the whole page) and coalesce bursts of mutations into one
                    // pass per frame; the observer is released in unobserveCanvas when the designer is left.
                    if (designer._httpErrorObserver) { designer._httpErrorObserver.disconnect(); designer._httpErrorObserver = null; }
                    var canvas = document.querySelector('.diagram-canvas');
                    if (canvas) {
                        var scheduled = false;
                        designer._httpErrorObserver = new MutationObserver(function () {
                            if (scheduled) { return; }
                            scheduled = true;
                            requestAnimationFrame(function () { scheduled = false; apply(); });
                        });
                        designer._httpErrorObserver.observe(canvas, { childList: true, subtree: true });
                    }
                },
                applyLinkStyles: function (activeIds, dimIds) {
                    var rootStyle = getComputedStyle(document.documentElement);
                    var defaultStroke = rootStyle.getPropertyValue('--link-stroke').trim() || '#9aa4b6';
                    var active = new Set(activeIds || []);
                    var dimmed = new Set(dimIds || []);
                    document.querySelectorAll('.diagram-link').forEach(function (group) {
                        var id = group.getAttribute('data-link-id');
                        var isActive = active.has(id);
                        var isDim = dimmed.has(id);
                        var isHttpError = group.getAttribute('data-http-error') === 'true';
                        group.querySelectorAll('path').forEach(function (path) {
                            // The library renders a wide transparent hit-area path beside the visible one.
                            if (path.getAttribute('stroke-width') === '12') return;
                            path.style.setProperty('stroke', isActive
                                ? (isHttpError ? '#dc2626' : '#6366f1')
                                : defaultStroke, 'important');
                            path.style.setProperty('opacity', isDim ? '0.3' : '1', 'important');
                            if (isActive) path.style.setProperty('stroke-width', '4px', 'important');
                            else if (isDim) path.style.setProperty('stroke-width', '1.5px', 'important');
                            else path.style.removeProperty('stroke-width');
                        });
                    });
                },
                clearLinkStyles: function () {
                    document.querySelectorAll('.diagram-link path').forEach(function (path) {
                        path.style.removeProperty('stroke');
                        path.style.removeProperty('stroke-width');
                        path.style.removeProperty('opacity');
                    });
                },
                // [width, height, topInset, leftInset] in CSS pixels for the flow canvas. The insets
                // are the space the floating node palette (top) and zoom stack (bottom left) take
                // from the canvas, so a fitted graph is not parked underneath them. The designer fits
                // the graph itself, because the diagram library's own fit clips wide graphs.
                viewport: function (selector) {
                    var el = document.querySelector(selector || '.diagram-canvas');
                    if (!el) { return null; }
                    var rect = el.getBoundingClientRect();
                    if (rect.width <= 0 || rect.height <= 0) { return null; }

                    var overlayBottom = function (overlaySelector) {
                        var overlay = document.querySelector(overlaySelector);
                        if (!overlay) { return 0; }
                        return Math.max(0, Math.round(overlay.getBoundingClientRect().bottom - rect.top));
                    };
                    var overlayRight = function (overlaySelector) {
                        var overlay = document.querySelector(overlaySelector);
                        if (!overlay) { return 0; }
                        return Math.max(0, Math.round(overlay.getBoundingClientRect().right - rect.left));
                    };

                    return [
                        Math.round(rect.width),
                        Math.round(rect.height),
                        overlayBottom('.diagram-toolbar'),
                        overlayRight('.zoom-controls')
                    ];
                },
                observeCanvas: function (dotNetHelper) {
                    window.simpleIPaaSDesigner.unobserveCanvas();
                    var el = document.querySelector('.diagram-canvas');
                    if (!el) { return; }
                    var last = '';
                    var notify = function () {
                        var rect = el.getBoundingClientRect();
                        var metrics = [Math.round(rect.width), Math.round(rect.height), Math.round(rect.top)];
                        var key = metrics.join(':');
                        if (key === last) { return; }
                        last = key;
                        dotNetHelper.invokeMethodAsync('NotifyCanvasMetrics', metrics).catch(function () { });
                    };
                    window.__simpleIPaaSCanvasObserver = new ResizeObserver(notify);
                    window.__simpleIPaaSCanvasObserver.observe(el);
                    window.requestAnimationFrame(notify);
                },
                unobserveCanvas: function () {
                    var designer = window.simpleIPaaSDesigner;
                    if (designer && designer._httpErrorObserver) {
                        designer._httpErrorObserver.disconnect();
                        designer._httpErrorObserver = null;
                    }
                    if (window.__simpleIPaaSCanvasObserver) {
                        window.__simpleIPaaSCanvasObserver.disconnect();
                        window.__simpleIPaaSCanvasObserver = null;
                    }
                }
            };
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link href="_content/Z.Blazor.Diagrams/style.css" rel="stylesheet" />
    <link href="_content/Z.Blazor.Diagrams/default.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1" />
    <link href="SimpleIPaaS.Client.styles.css" rel="stylesheet" />
    <style>
        #app-splash {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background:
                radial-gradient(900px 420px at 50% -10%, rgba(79, 70, 229, 0.14), transparent 65%),
                #f4f6fa;
            color: #6a7891;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            text-align: center;
        }

        #app-splash .app-splash-mark {
            width: 46px;
            height: 46px;
            margin: 0 auto 20px;
            border-radius: 13px;
            background: linear-gradient(140deg, #7c7cf5 0%, #4f46e5 48%, #3b31b8 100%);
            box-shadow: 0 8px 20px -8px rgba(79, 70, 229, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            line-height: 1;
        }

        #app-splash .app-splash-title {
            margin: 0 0 6px;
            font-size: 16px;
            font-weight: 650;
            letter-spacing: -0.02em;
            color: #0d1526;
        }

        #app-splash p { margin: 0; font-size: 13px; }

        #app-splash .app-splash-spinner {
            width: 26px;
            height: 26px;
            margin: 18px auto 0;
            border: 2px solid #e3e8ef;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: app-splash-spin 0.9s linear infinite;
        }

        html[data-theme="dark"] #app-splash {
            background:
                radial-gradient(900px 420px at 50% -10%, rgba(124, 124, 245, 0.18), transparent 65%),
                #0a0d14;
            color: #8593a8;
        }
        html[data-theme="dark"] #app-splash .app-splash-title { color: #e8ecf3; }
        html[data-theme="dark"] #app-splash .app-splash-spinner { border-color: #262e3d; border-top-color: #8b95ff; }

        @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div id="app-splash">
            <div>
                <div class="app-splash-mark">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M13 2 4.5 13.5H11l-.5 8.5L19.5 10H13z" />
                    </svg>
                </div>
                <p class="app-splash-title">fusetor.com</p>
                <p>Preparing your integration workspace…</p>
                <div class="app-splash-spinner"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href=".">Reload</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="_content/Z.Blazor.Diagrams/script.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
