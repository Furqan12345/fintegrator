<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleIPaaS — Integration Builder</title>
    <base href="/" />
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('simpleipaas-theme'); } catch (e) { }
            var theme = stored === 'dark' || stored === 'light'
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            window.simpleIPaaSTheme = {
                get: function () {
                    return document.documentElement.getAttribute('data-theme') || 'light';
                },
                set: function (value) {
                    var next = value === 'dark' ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', next);
                    try { localStorage.setItem('simpleipaas-theme', next); } catch (e) { }
                    return next;
                }
            };

            window.simpleIPaaSLayout = {
                getSidebar: function () {
                    try { return localStorage.getItem('simpleipaas-sidebar') || 'expanded'; } catch (e) { return 'expanded'; }
                },
                setSidebar: function (value) {
                    try { localStorage.setItem('simpleipaas-sidebar', value); } catch (e) { }
                    return value;
                }
            };

            window.simpleIPaaSFullscreen = {
                isEnabled: function () {
                    return document.fullscreenEnabled !== undefined;
                },
                isActive: function () {
                    return document.fullscreenElement !== undefined && document.fullscreenElement !== null;
                },
                enter: function (selector) {
                    var el = selector ? document.querySelector(selector) : (document.fullscreenElement || document.documentElement);
                    if (!el) { return Promise.reject('element not found'); }
                    return el.requestFullscreen();
                },
                exit: function () {
                    if (document.exitFullscreen) { return document.exitFullscreen(); }
                    return Promise.resolve();
                },
                onFullScreenChange: function (dotNetHelper) {
                    document.addEventListener('fullscreenchange', function () {
                        dotNetHelper.invokeMethodAsync('NotifyFullscreenChange').catch(function () { });
                    });
                }
            };
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link href="_content/Z.Blazor.Diagrams/style.css" rel="stylesheet" />
    <link href="_content/Z.Blazor.Diagrams/default.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SimpleIPaaS.Client.styles.css" rel="stylesheet" />
    <style>
        #app-splash {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background:
                radial-gradient(900px 420px at 50% -10%, rgba(79, 70, 229, 0.14), transparent 65%),
                #f4f6fa;
            color: #6a7891;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            text-align: center;
        }

        #app-splash .app-splash-mark {
            width: 46px;
            height: 46px;
            margin: 0 auto 20px;
            border-radius: 13px;
            background: linear-gradient(140deg, #7c7cf5 0%, #4f46e5 48%, #3b31b8 100%);
            box-shadow: 0 8px 20px -8px rgba(79, 70, 229, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            line-height: 1;
        }

        #app-splash .app-splash-title {
            margin: 0 0 6px;
            font-size: 16px;
            font-weight: 650;
            letter-spacing: -0.02em;
            color: #0d1526;
        }

        #app-splash p { margin: 0; font-size: 13px; }

        #app-splash .app-splash-spinner {
            width: 26px;
            height: 26px;
            margin: 18px auto 0;
            border: 2px solid #e3e8ef;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: app-splash-spin 0.9s linear infinite;
        }

        html[data-theme="dark"] #app-splash {
            background:
                radial-gradient(900px 420px at 50% -10%, rgba(124, 124, 245, 0.18), transparent 65%),
                #0a0d14;
            color: #8593a8;
        }
        html[data-theme="dark"] #app-splash .app-splash-title { color: #e8ecf3; }
        html[data-theme="dark"] #app-splash .app-splash-spinner { border-color: #262e3d; border-top-color: #8b95ff; }

        @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="importmap"></script>
    <script src="_content/Z.Blazor.Diagrams/script.min.js"></script>
</head>

<body>
    <div id="app">
        <div id="app-splash">
            <div>
                <div class="app-splash-mark">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M13 2 4.5 13.5H11l-.5 8.5L19.5 10H13z" />
                    </svg>
                </div>
                <p class="app-splash-title">SimpleIPaaS</p>
                <p>Preparing your integration workspace…</p>
                <div class="app-splash-spinner"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href=".">Reload</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
