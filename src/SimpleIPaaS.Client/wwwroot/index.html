<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleIPaaS — Integration Builder</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="_content/Z.Blazor.Diagrams/style.css" rel="stylesheet" />
    <link href="_content/Z.Blazor.Diagrams/default.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SimpleIPaaS.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script src="_content/Z.Blazor.Diagrams/script.min.js"></script>
</head>

<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#94a3b8;font-family:Inter,system-ui,sans-serif;">
            <div style="text-align:center;">
                <div style="width:40px;height:40px;border:3px solid #334155;border-top:3px solid #3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div>
                <p>Loading iPaaS Builder...</p>
            </div>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;right:0;padding:12px 20px;background:#dc2626;color:white;z-index:9999;font-family:Inter,system-ui,sans-serif;font-size:14px;">
        An unhandled error has occurred.
        <a href="." style="color:white;font-weight:600;margin-left:8px;">Reload</a>
        <span class="dismiss" style="cursor:pointer;margin-left:12px;">✕</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
