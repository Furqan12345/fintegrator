<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleIPaaS — Integration Builder</title>
    <base href="/" />
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('simpleipaas-theme'); } catch (e) { }
            var theme = stored === 'dark' || stored === 'light'
                ? stored
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            window.simpleIPaaSTheme = {
                get: function () {
                    return document.documentElement.getAttribute('data-theme') || 'light';
                },
                set: function (value) {
                    var next = value === 'dark' ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', next);
                    try { localStorage.setItem('simpleipaas-theme', next); } catch (e) { }
                    return next;
                }
            };
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link href="_content/Z.Blazor.Diagrams/style.css" rel="stylesheet" />
    <link href="_content/Z.Blazor.Diagrams/default.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SimpleIPaaS.Client.styles.css" rel="stylesheet" />
    <style>
        #app-splash {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f5f6f8;
            color: #697586;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
        }

        #app-splash .app-splash-spinner {
            width: 34px;
            height: 34px;
            margin: 0 auto 16px;
            border: 3px solid #e2e5ea;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: app-splash-spin 0.9s linear infinite;
        }

        html[data-theme="dark"] #app-splash { background: #0d1117; color: #8792a4; }
        html[data-theme="dark"] #app-splash .app-splash-spinner { border-color: #2a3240; border-top-color: #8b95ff; }

        @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="importmap"></script>
    <script src="_content/Z.Blazor.Diagrams/script.min.js"></script>
</head>

<body>
    <div id="app">
        <div id="app-splash">
            <div>
                <div class="app-splash-spinner"></div>
                <p>Loading SimpleIPaaS...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href=".">Reload</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
